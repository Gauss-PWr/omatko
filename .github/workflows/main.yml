name: Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: /home/omatko/apps/omatko

    steps:
      - name: Check if tag is on main
        id: check
        run: |
          git fetch origin main
          git merge-base --is-ancestor ${{ github.sha }} origin/main \
            && echo "on_main=true" >> $GITHUB_OUTPUT \
            || echo "on_main=false" >> $GITHUB_OUTPUT

      - name: Checkout
        if: steps.check.outputs.on_main == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        if: steps.check.outputs.on_main == 'true'
        run: hugo -s /home/omatko/apps/omatko

      - name: Deploy to /www
        if: steps.check.outputs.on_main == 'true'
        run: rsync -a --delete /home/omatko/apps/omatko/public/ /srv/omatko