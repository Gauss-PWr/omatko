'on':
  push:
    branches:
      - main
    paths:
      - 'content/**'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip build]')"
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: bun i
      - name: Build
        run: hugo -s "$GITHUB_WORKSPACE"

      - name: Deploy to /srv/omatko
        run: rsync -rlD --delete "$GITHUB_WORKSPACE/public/" /srv/omatko
