{{ define "main" }}
  <section class="last-editions">
    <h1>{{ .Title }}</h1>
    <div class="last-edition-articles-container">
      {{ range (.Pages.ByParam "eventYear").Reverse }}
      <div class="article-preview-container">
          <article
            class="article-preview"
            id="{{ .Params.eventYear }}{{ .Title | lower }}"
          >
            <a href="{{ .RelPermalink }}">
            <h2>{{ .Params.title }} edycja OMatKo!!!</h2>
                <p>{{ .Params.eventYear }}</p>
            </a>
          </article>
        </div>
      {{ end }}
    </div>
  </section>
{{ end }}
