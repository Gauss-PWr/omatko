<section class="banner">
    {{ if .Site.Params.enable_background_animations }}
    {{ partial
      "sections/background.html" .
    }}
  {{ end }}
  <div class="banner-logo">
    <img src="logo.webp" alt="Logo OMatKo" />
    <p>XIII Edycja Ogólnopolskiej Matematycznej Konferencji Studentów</p>
    <p>5-7 grudnia 2026</p>
  </div>
  <div class="banner-timer">
    <p>Pozostało:</p>
    <div id="timer">
      <div class="countdown-item">
        <span class="countdown-number" style="color: var(--o-green)">00</span>
        <span class="countdown-label">dni</span>
      </div>
      <div class="countdown-item">
        <span class="countdown-number" style="color: var(--o-blue)">00</span>
        <span class="countdown-label">godzin</span>
      </div>
      <div class="countdown-item">
        <span class="countdown-number" style="color: var(--o-orange)">00</span>
        <span class="countdown-label">minut</span>
      </div>
      <div class="countdown-item">
        <span class="countdown-number" style="color: var(--o-gray)">00</span>
        <span class="countdown-label">sekund</span>
      </div>
    </div>
    <script>
      // Usage
      document.addEventListener("DOMContentLoaded", function () {
        const targetDate = new Date(2026, 11, 5, 13, 30, 0);
        countdownToDate(targetDate, "timer", "Konferencja rozpoczęta!");
      });
    </script>
  </div>
</section>
