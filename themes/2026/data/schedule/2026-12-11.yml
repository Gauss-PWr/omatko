    - name: "Trochę ogólniej o odkryciu Hamiltona"
      speaker: "Wiktor Smolak"
      type: "Blok teoretyczny"
      abstract: |-
        Ośmielony użytecznością ciała liczb zespolonych irlandzki matematyk W. Hamilton zdefiniował w 1843 roku pewną czterowymiarową, nieprzemienną algebrę nad ciałem liczb rzeczywistych (nazwaną później jego nazwiskiem algebrą kwaternionów Hamiltona i oznaczoną symbolem \(\mathbb{H}\)), która umożliwia wygodne przedstawienie przekształceń trójwymiarowej przestrzeni euklidesowej. Dana struktura użyteczna jest po dziś dzień oraz ma liczne zastosowania w matematyce i poza nią, o czym krótko wspomnimy na początku referatu. Niemniej jednak rozważania na jej temat doprowadziły do sformułowania ogólnej definicji algebry kwaternionów nad dowolnym ciałem (w szczególności skupimy sie na ciałach o charakterystyce różnej od 2, co zapewni nam nieprzemienność). Wśród różnych algebr kwaternionów, które w ogólności są centralnymi algebrami prostymi można znaleźć algebry z dzieleniem (taką algebrą jest również \(\mathbb{H}\)) oraz algebry z dzielnikami zera, które nazywamy rozszczepionymi i o których powiemy trochę więcej w kontekście ich izomorficzności z algebrą macierzy kwadratowych \(2\times 2\) o współczynnikach z ciała nad którym definiujemy daną algebrę kwaternionów. W szczególności pokażemy, że algebra kwaternionów jest algebrą z dzieleniem albo wspomniany izomorfizm istnieje, co po stwierdzeniu pewnej własności rozszerzeń ciał przeniesie nas do rozważań na temat stożkowej stowarzyszonej do algebry kwaternionów i zagadnienia polegającego na znalezieniu jej punktów F-wymiernych, co z kolei ma zastosowanie w rozwiązywaniu równań diofantycznych.
    - name: "Od serii do pętli: jak dobór cech zmienia topologię danych treningowych w trójboju siłowym?"
      speaker: "Paweł Drzyzga"
      type: "Blok stosowany"
      abstract: |-
        Treningi o tej samej liczbie powtórzeń i średnim ciężarze mogą różnić się organizacją serii. Na przykładzie realnego planu trójboisty pokażę, jak topologiczna analiza danych pomaga badać podobieństwo i powtarzalność treningów. Wykorzystując homologie persystentne, omówię powstawanie pętli oraz wpływ doboru cech, reprezentacji czasu i skali odległości na otrzymane struktury. Wyniki porównam z prostymi opisami programu, wskazując możliwości wykorzystania tych analiz oraz granice ich interpretacji. Przedstawię też kierunki weryfikacji wyników na nowych danych.
- time: "18:00"
  events:
    - name: "Niech moc będzie z nami, czyli o co chodzi w tym całym forsingu"
      speaker: "Bartosz Kamiński"
      type: "Blok teoretyczny"
      abstract: |-
        Wielu matematyków słysząc słowo ***forsing***, wychodzi z założenia, że to ekwiwalent potwora, który w najlepszym przypadku nie ma sensu, a w najgorszym jest pierwszą oznaką szaleństwa.
        I choć szaleństwo można przypisać każdej osobie, która po prostu uprawia matematykę, to okaże się, że forsing nie jest taki straszny, jak go malują.
        Na referacie postaram się pokazać, że forsing to nic więcej jak dołożenie nowego elementu do naszego "worka" po to, żeby jakieś konkretne zdanie stało się prawdziwe. Pokażę to poprzez „wyforsowanie” z pierścienia \(\mathbb{Q}\) nowego pierścienia \(\mathbb{Q}[\sqrt{2}]\) oraz, dla kontrastu, błędne forsowanie ze zbioru \(\mathbb{N}\) struktury \(\mathbb{N}[\frac{1}{2}]\). Te analogie pomogą nam zrozumieć, w jaki sposób dowodzi się niezależności \(\mathrm{CH}\) od aksjomatów \(\mathrm{ZFC}\).
    - name: "Wypukłość strachu i wklęsłość chciwości: matematyka teorii perspektywy"
      speaker: "Oliwia Ciupińska"
      type: "Blok stosowany"
      abstract: |-
        Klasyczna ekonomia zakłada, że w warunkach niepewności zawsze dążymy do maksymalizacji matematycznej wartości oczekiwanej. Jednak badania Daniela Kahnemana i Amosa Tversky'ego dowodzą, że ludzki umysł systematycznie łamie aksjomaty rachunku prawdopodobieństwa.
        Wystąpienie rozpocznę od krótkiego eksperymentu decyzyjnego na żywo z udziałem publiczności. Sprawdzę w nim, jak jedno słowo w opisie problemu potrafi całkowicie odwrócić nasze wybory przy identycznej wartości oczekiwanej. Następnie przełożę wyniki tego doświadczenia na język analizy matematycznej. Omówię własności funkcji wartości (jej asymetrię, brak różniczkowalności w zerze oraz tytułową wklęsłość dla zysków i wypukłość dla strat), a także nieliniową funkcję wag decyzyjnych. Na koniec podstawię wyniki głosowania z sali do równań teorii perspektywy i pokażę, jak dokładnie matematyka potrafi przewidzieć ludzką irracjonalność.
