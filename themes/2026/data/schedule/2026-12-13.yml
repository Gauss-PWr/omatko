- time: "10:00"
  events:
    - name: "Od krzywej Gaussa do profilu Barenblatta: jak nieliniowa dyfuzja zapomina warunki początkowe?"
      speaker: "Mateusz Wojnarowski"
      type: "Blok teoretyczny"
      abstract: |-
        W teorii równania ciepła istnieje odpowiednik centralnego twierdzenia granicznego. Choć rozwiązanie równania ciepła zależy od warunku początkowego, jego asymptotyczny kształt wyznacza krzywa Gaussa, a jedyną istotną informacją o danych początkowych jest całkowita masa. Naturalne jest pytanie, czy podobne twierdzenie można sformułować dla równań nieliniowych.
 
        W równaniu ośrodka porowatego \(u_t=\Delta(u^m)\), dla \(m>1\) miejsce Gaussa zajmuje profil Barenblatta. Pokażemy, jak można go wyprowadzić, poszukując rozwiązań samopodobnych i wykorzystując zachowanie masy.
 
        Samo znalezienie takiego rozwiązania nie wyjaśnia jednak, dlaczego miałoby ono opisywać zachowanie innych rozwiązań. Odpowiedź daje twierdzenie o asymptotycznej zbieżności rozwiązań do profilu Barenblatta w \(L^1(\mathbb R^N)\). Przedstawimy jego treść i naszkicujemy, jak za pomocą skalowania, zwartości i jednoznaczności można tę zbieżność wykazać. W ten sposób od konstrukcji jednego szczególnego rozwiązania przejdziemy do opisu asymptotyki całej klasy rozwiązań.
    - name: "Normy unitarnie niezmiennicze w problemie aproksymacji macierzy."
      speaker: "Filip Panas"
      type: "Blok stosowany"
      abstract: |-
        W trakcie wystąpienia przybliżę zagadnienie niskorzędowej aproksymacji macierzy. Punktem wyjścia będzie rozkład SVD (singular value decomposition), na którym opiera się twierdzenie Eckarta-Younga, podające postać najlepszego przybliżenia danej macierzy przy użyciu macierzy ustalonego niższego rzędu (względem normy Frobeniusa lub normy spektralnej). Zostanie omówiony przykład zastosowania tego wyniku jako prostego narzędzia do kompresji obrazów cyfrowych. Następnie przejdę do uogólnienia tego twierdzenia na przypadek całej klasy norm unitarnie niezmienniczych (twierdzenie Eckarta-Younga-Mirsky'ego).
- time: "10:30"
  events:
    - name: "Mat w #nieskończoność"
      speaker: "Tymon Świtalski"
      type: "Blok teoretyczny"
      abstract: |-
        Każdy, kto miał styczność z szachami, spotkał się z zadaniami typu "znajdź mata w n ruchach". Jeśli jednak uwolnimy szachy z ich skończonych ram, możliwe są pozycje, w których jeden z graczy może wymusić mata, ale drugi może go dowolnie długo odwlekać. Do opisu takich pozycji okazują się potrzebne pozaskończone liczby porządkowe. Poszukiwanie pozycji o takich własnościach rozpoczęło się od pytania na MathOverflow ponad 15 lat temu i finalnie zostało zamknięte w tym roku poprzez zanurzenie arbitralnej, otwartej gry Gale'a-Stewarta z remisami w pozycji szachowej. Podczas referatu przyjrzymy się wybranym konstrukcjom powstałym w tym czasie.
    - name: "O tym, jak matematyka poszła w las"
      speaker: "Mikołaj Beśka"
      type: "Blok stosowany"
      abstract: |-
        Środowisko naturalne, mimo niezwykłej złożoności poddaje się efektywnemu modelowaniu matematycznemu. W niniejszym referacie przyjrzymy się kilku modelom ekologicznych, opartym na układach równań różniczkowych.
 
        Najprostszym podejściem jest model Lotki-Volterry. Mimo prostoty dobrze opisuje on pewne zachowania się populacji, lecz ma pewne wady. Naturalne rozszerzenie poprawia własności modelu, ale nie rozwiązuje wszystkich problemów.
 
        W pierwszej części referatu skupimy się na analizie nieco bardziej rozbudowanego modelu drapieżnik-ofiara - dodamy do równań człon, dzięki któremu pojawią się oscylacje obserwowane w rzeczywistości. Podejdziemy do zadania teoretycznie, ale też przez numeryczne symulacje. W drugiej natomiast zobaczymy, co się zmienia, gdy od równań zwyczajnych przejdziemy do równań różniczkowych z opóźnieniem, gdzie skupimy się głównie na analizie numerycznej modelu.
