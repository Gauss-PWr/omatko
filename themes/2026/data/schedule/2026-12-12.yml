    - name: "Co kule mówią o przestrzeni? O hiperwypukłości przestrzeni metrycznych"
      speaker: "Kacper Jarosiński"
      type: "Blok teoretyczny"
      abstract: |-
        Geometria przestrzeni metrycznych nie musi ograniczać się do badania odległości między punktami. Czy możemy poznać własności całej przestrzeni, badając jedynie to, jak przecinają się w niej kule? Czy warunek geometryczny może prowadzić do twierdzeń o punktach stałych i rozszerzaniu odwzorowań? Pytanie to prowadzi do pojęcia hiperwypukłości przestrzeni metrycznych, wprowadzonego przez Aronszajna i Panitchpakdiego, czyli przestrzeni, w których odpowiednio dobrane rodziny kul mają niepuste przecięcie.
        W referacie przedstawione zostaną podstawowe idee i przykłady związane z hiperwypukłością oraz metoda konstrukcji takich przestrzeni. Przyjrzymy się wybranym własnościom tych przestrzeni oraz ich kluczowemu znaczeniu w teorii punktów stałych i rozszerzaniu odwzorowań.  Szczególnie interesującym zagadnieniem będzie możliwość zastąpienia sprawdzania warunku dla dowolnej rodziny kul na rodziny skończone.
        Celem referatu jest pokazanie jak z pozoru prosty warunek geometryczny może prowadzić do zaskakujących wyników.
    - name: "Jak wilki dzielą przestrzeń? Matematyczny model powstawania terytoriów"
      speaker: "Piotr Duchnik"
      type: "Blok stosowany"
      abstract: |-
        Przeanalizujemy model formowania terytoriów wilków, którego podstawowym mechanizmem jest znakowanie zapachem. Model wykorzystuje równania dyfuzji i konwekcji do opisania przewidywanego rozkładu gęstości osobników. Rozpatrzymy przypadki modelu dla różnych liczb watah, oraz omówimy interakcje, które zachodzą pomiędzy sąsiadującymi watahami i zależności między rozmiarem watahy a rozmiarem terytorium.
