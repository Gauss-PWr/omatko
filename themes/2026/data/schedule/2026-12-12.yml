  events:
    - name: "Prawie nigdzie, lecz dość często. Prawo Benforda dla orbit układów dynamicznych."
      speaker: "Patryk Wojtkowiak"
      type: "Blok teoretyczny"
      abstract: |-
        Referat przedstawia prawo Benforda w kontekście ciągów liczbowych oraz orbit układów dynamicznych. Na przykładzie funkcji o wzroście super-wykładniczym omówiony zostanie pozorny konflikt między teorią miary a topologią: choć orbity podlegają prawu Benforda dla niemal każdego punktu początkowego w sensie miary Lebesgue’a, zbiór punktów niespełniających pozostaje gęsty i nieprzeliczalny. Wykład przybliży trudności związane z weryfikacją tej własności dla elementarnych stały (takich jak \(\sqrt{2}\) czy liczby całkowite) oraz wskaże, jak pojęcie normalności i konstrukcja binarna stałej Champernowne pozwalają podać jawny przykład punktu tworzącej taką orbitę.
    - name: "Kiedy kłamstwo się opłaca, a kiedy przestaje - ewolucyjna teoria gier mimikry Batesa"
      speaker: "Marcin Król"
      type: "Blok stosowany"
      abstract: |-
        Mimikra Batesa to biologiczne przystosowanie obronne, w którym mimik (gatunek bezbronny) upodabnia się barwą, dźwiękiem lub zachowaniem do gatunku niebezpiecznego bądź nieatrakcyjnego dla drapieżcy.
 
        W prezentacji przedstawiono model matematyczny gry sygnalizacyjnej. Zdefiniowano przestrzeń sygnałów oraz strategię sygnalizacyjną z promieniem cechy odniesienia \(q\), wykorzystywanym w funkcji decyzyjnej \(A\) określającej werdykt drapieżcy w sprawie ataku. Następnie wprowadzono funkcję wypłaty \(U\) oraz funkcję oczekiwanej użyteczności odbiorcy \(\Theta\), za pomocą których w przykładzie obliczono próg częstości \(\mu^*\) mimików w populacji. Przekroczenie tego progu sprawia, że ataki drapieżców stają się korzystne; w przeciwnym wypadku zyskują oszuści.
 
        W dalszej części pogłębiono pojęcie progu częstości i rozszerzono model o strategie mieszane, w których drapieżcy podejmują decyzje zgodnie z określonym rozkładem prawdopodobieństwa. Zdefiniowano funkcję logistycznej dynamiki wyboru wraz z jednowymiarowym równaniem replikatora, przewidującym zmiany częstości mimików na podstawie ich oczekiwanego sukcesu ewolucyjnego. W przykładzie pokazano, że częstość mimików oscyluje wokół poziomu optymalnego zarówno dla nich, jak i dla gatunku jadowitego, co zilustrowano na wykresach.
- time: "18:30"
  events:
    - name: "Paradoks Mycielskiego-Sierpińskiego"
      speaker: "Michał Warmuz"
      type: "Blok teoretyczny"
      abstract: |-
        Zbiory niemierzalne w sensie Lebesgue'a kojarzą się z obiektami chaotycznymi, których istnienie prowadzi do paradoksów, jak na przykład znany paradoksalny podział kuli zaproponowany przez Banacha i Tarskiego.
        Okazuje się jednak, że odrzucenie aksjomatu wyboru i przyjęcie w jego miejsce aksjomatu "wszystkie podzbiory prostej rzeczywistej są mierzalne w sensie Lebesgue'a" też niesie ze sobą niespodziewane konsekwencje. Przykładem ich jest paradoks Mycielskiego-Sierpińskiego, który orzeka, że w tym wypadku zbiór liczb rzeczywistych da się podzielić na rodzinę parami rozłącznych zbiorów niepustych, której moc jest ściśle większa niż continuum.
        W prezentacji zostanie szczegółowo omówiony ten paradoks oraz będzie przedstawiony jego dowód formalny.
    - name: "Kod, który wybacza błędy - matematyka odporności kodu genetycznego"
      speaker: "Lidia Gozdecka"
      type: "Blok stosowany"
      abstract: |-
        Kod genetyczny zostanie przedstawiony jako pokolorowany graf Hamminga H(3,4); wierzchołki to kodony, czyli trójki nukleotydów, krawędzie są mutacjami punktowymi -substytucjami, a kolory to znaczenia kodonów - 20 aminokwasów i “stop”. Taki model pozwala ilościowo określić, jak właściwości kodu pozwalają na ograniczanie skutków substytucji - rodzaju mutacji punktowych, w których podmieniane są nukleotydy. Tolerancja błędów - będąca wynikiem nadmiarowości kodu genetycznego (w biologii nazywanej zdegenerowaniem) - ogranicza utratę informacji o sekwencji aminokwasowej białek. Informacja ta jest zapisana za pomocą sekwencji nukleotydowej, z której tłumaczona jest na sekwencję aminokwasową, będącą podstawą struktury białka. Na grafie Hamminga można określić miarę odporności jako ułamek krawędzi pozostających wewnątrz klas (kolorów/aminokwasów), przy jednakowym prawdopodobieństwie substytucji. Taka miara jest prawdopodobieństwem, że zmiana nukleotydu nie zmieni aminokwasu, a więc nie zmieni sekwencji białka. Dla klas o zadanych rozmiarach górną granicę tej miary daje rozwiązanie krawędziowego problemu izoperymetrycznego o zadanej liczebności w grafach Hamminga (tw. Lindseya, 1964): minimalizacja krawędzi wychodzących na zewnątrz w określonej grupie wierzchołków. Wstępne obliczenia wskazują, że standardowy kod genetyczny jest bliski tej granicy.
        Standardowy kod genetyczny, który błędy toleruje, zostanie porównany do używanych w informatyce kodów nadmiarowych - takich jak kod Hamminga, który błędy koryguje i wykrywa, oraz kod fontannowy, który pozwala na odtworzenie utraconych fragmentów.
        Następnie, zasymulowane zostanie wykorzystanie DNA do zakodowania krótkiej informacji będącej ciągiem aminokwasów, jako sekwencji nukleotydów. Standardowy kod genetyczny zostanie tu porównany z innymi teoretycznie możliwymi kodami genetycznymi oraz kodem losowym. Inne teoretycznie możliwe kody genetyczne to inne warianty grafu H(n,q)[gdzie n to długość słowa/kodonu, a q to liczba nukleotydów/liter alfabetu], a kolorowanie nadal dzieli zbiór wierzchołków na 21 klas o możliwie równych rozmiarach. Kod losowy to taki, że wierzchołki są losowo rozdzielone pomiędzy tę samą liczbę klas o zachowanych rozmiarach. W symulacji zostaną wprowadzone losowe zmiany (substytucje) na poziomie nukleotydowym.  Zachowanie oryginalnej informacji pomiędzy różnymi wariantami grafów zostanie porównane z przewidywaniami analitycznymi opartymi na prawdopodobieństwie zmiany aminokwasu. Miarą zachowania informacji jest odsetek poprawnie odtworzonych znaków (aminokwasów).
        Na zakończenie omówione zostaną koncepcje wykorzystania kodu genetycznego w teoretycznych metodach biosteganografii - ukrywania informacji w DNA.
 
