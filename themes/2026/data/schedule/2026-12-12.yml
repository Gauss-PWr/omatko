  events:
    - name: "Fabryka liczb: Jak algebry Clifforda, mnożąc wektory, tworzą (nie)znane struktury"
      speaker: "Michał Stadnik"
      type: "Blok teoretyczny"
      abstract: |-
        W wystąpieniu opowiem o algebrach Clifforda jako uniwersalnym narzędziu pozwalającym w sposób systematyczny generować struktury algebraiczne. Dzięki nim możemy uogólnić konstrukcję liczb zespolonych czy kwaternionów. Punktem wyjścia będzie pozornie proste pytanie: co się stanie, jeśli pozwolimy wektorom mnożyć się przez siebie i zażądamy, aby kwadrat wektora był zwykłą liczbą? Prowadzi to do konstrukcji algebry łącznej, w której kwadrat wektora jest utożsamiany z wartością ustalonej formy kwadratowej \(Q\) zgodnie z relacją \(v^2=Q(v) \cdot 1\). Dzięki temu prostemu założeniu dostajemy bogatą klasę algebr, w której liczby zespolone, dualne czy kwaterniony są szczególnymi przypadkami zależnymi od wymiaru i sygnatury \(Q\). Na zakończenie przedstawię inne przykłady algebr Clifforda, które mają zastosowania w fizyce teoretycznej oraz grafice komputerowej, gdzie służą one do eleganckiego opisu rotacji i transformacji geometrycznych.
    - name: "Szorstka prawda czy gładka manipulacja? O próbie aproksymacji dyskretnej liczby punktów rozkładem ciągłym"
      speaker: "Paweł Podolak"
      type: "Blok stosowany"
      abstract: |-
        Centralne Twierdzenie Graniczne jest jednym z najczęściej stosowanych twierdzeń w analizie danych testowych, w szczególności w ramach teorii odpowiedzi na pozycje testowe (IRT). Bezrefleksyjne stosowanie aproksymacji rozkładem normalnym stanowi jednak potężne ryzyko metodologiczne. Celem niniejszej pracy jest analiza granic stosowalności CTG ze szczególnym uwzględnieniem złamania warunku Lapunowa stosowanego przy sumie zmiennych losowych o różnych rozkładach.
 
        W ramach badań przeprowadzono symulacje numeryczne Monte Carlo w środowisku R dla modeli IRT (3PL/GPCM). Analizie porównawczej poddano dwa podejścia: klasyczną, efektywną aproksymację rozkładem normalnym oraz dokładną, lecz bardziej złożoną obliczeniowo metodę wyznaczania splotu zmiennych losowych. Badania zrealizowano w dwóch scenariuszach: dla portfeli jednorodnych (same zadania zamknięte) i portfeli niejednorodnych (zadania zamknięte i otwarte) zadań z egzaminu maturalnego z matematyki na poziomie podstawowym 2026. Różnorodność punktacji za zadania otwarte jawnie narusza warunek Lapunowa.
 
        Wystąpienie koncentruje się na analizie skutkowo-przyczynowej: porównano różnice w obu podejściach pod względem zagregowanego ryzyka egzaminacyjnego (tzn. szans na przekroczenie progu zdawalności) oraz dokładnego rozkładu punktów dla wybranych wartości cechy ukrytej poprzez ilustrację wskaźników błędu, tj. RMSE, MAE, MaxAE oraz wyników nieparametrycznych testów statystycznych, z szczególnym uwzględnieniem wysokiej mocy testu dla dużej próby badawczej. Praca podkreśla również istotną rolę zastosowania poprawki na ciągłość w celu zminimalizowania różnic między wynikami uzyskanymi za pomocą CTG a za pomocą splotów.
 
        Choć badania oparto na danych syntetycznych, co stanowiło warunek konieczny do przeprowadzenia jednowymiarowej symulacji (przy założeniu o pomijalnym wpływie efektu wiązek zadań na odpowiedzi ucznia), są one w pełni wystarczające do zobrazowania istoty problemu. Wyniki obrazują skalę zniekształceń dokonywanych przez „wygładzanie” dyskretnej natury rozkładu punktów. Zaprezentowane wnioski stanowią krytyczny głos w dyskusji nad stosowaniem twierdzeń granicznych w inżynierii i analizie danych oraz wskazują na konieczność weryfikacji założeń do zastosowania poprawnego narzędzia.
- time: "10:30"
  events:
    - name: "Granicy obliczalności strzegą bobry, czyli o nieintuicyjnych własnościach funkcji Busy Beaver"
      speaker: "Szymon Dziewoński"
      type: "Blok teoretyczny"
      abstract: |-
        Stworzona w 1962 r. przez Tibora Radó gra w pracowitego bobra (ang. Busy Beaver) polega na znalezieniu takiej \(n\)-stanowej maszyny Turinga, która zakończy swoje działanie wykonując jak najwięcej kroków lub wypisując jak najwięcej jedynek. Funkcje \(S(n)\) i \(\Sigma(n)\) określają odpowiednie największe możliwe wyniki do uzyskania. Okazuje się, że pomimo prostej, kombinatorycznej definicji, są one nieobliczalne, a tempo ich wzrostu wykracza poza klasyczne hierarchie matematyczne. Co więcej, w swoich skończonych wartościach kodują one odpowiedzi na wiele współczesnych problemów otwartych.
 
        Referat rozpoczniemy od formalnego zdefiniowania gry w pracowitego bobra i przeanalizujemy wartości wspomnianych wcześniej funkcji dla małych \(n\). Następnie pokażemy, że rosną one szybciej niż jakakolwiek funkcja obliczalna. Na koniec przeanalizujemy ich związek z m.in. hipotezami Collatza, Goldbacha i Riemanna oraz problem wyznaczania ich wartości wewnątrz aksjomatyki ZFC.
    - name: "Kiedy więcej danych oznacza mniej prawdy? Paradoksy imputacji średnią."
      speaker: "Marlena Sadowska"
      type: "Blok stosowany"
      abstract: |-
        Wyobraźmy sobie, że zbieramy dane ankietowe o zarobkach lekarzy i prawników, jednak część osób nie odpowiedziała na pytanie o wysokość wynagrodzenia. Najprostszym sposobem na uzupełnienie tych braków jest imputacja średnią. Choć metoda ta nie zmienia średniej z zaobserwowanych wartości, może znacząco zaburzać ich zmienność!
 
        W swoim wystąpieniu pokażę, że nawet w prostym modelu matematycznym, przy losowo występujących brakach danych, imputacja średnią może prowadzić do zaskakujących wniosków. Gdy wariancje w obu grupach są równe, test statystyczny może wykrywać różnice, których w rzeczywistości nie ma. Z drugiej strony, gdy wariancje faktycznie się różnią, imputacja może skutecznie maskować tę różnicę.
 
        Co więcej, przy ustalonym odsetku braków zwiększanie liczebności próby może pogłębiać problem fałszywych odrzuceń hipotezy zerowej! Przedstawię matematyczne uzasadnienie tych zjawisk, wyprowadzając zależności opisujące wpływ imputacji na wariancję oraz rozkład statystyki testu Bartletta, a otrzymane wyniki zilustruję eksperymentami symulacyjnymi.
