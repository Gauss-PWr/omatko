    - name: "Półciągłość i punkty stałe - twierdzenie Kakutaniego w teorii gier"
      speaker: "Patryk Osika"
      type: "Blok teoretyczny"
      abstract: |-
        **Abstrakt**
 
        Celem referatu jest przedstawienie twierdzenia o punkcie stałym Kakutaniego oraz jego zastosowania w dowodzie twierdzenia Nasha o istnieniu równowagi w teorii gier. W pierwszej części omówione zostaną podstawowe pojęcia dotyczące odwzorowań wielowartościowych, w szczególności górna i dolna semiciągłość oraz górna i dolna hemiciągłość. Przedstawione zostaną definicje tych własności, ich wzajemne relacje oraz wybrane kryteria pozwalające na ich weryfikację, ze szczególnym uwzględnieniem związku między górną hemiciągłością a domkniętością grafu odwzorowania przy odpowiednich założeniach.
 
        W dalszej części referatu zaprezentowane zostanie twierdzenie Kakutaniego wraz z omówieniem jego założeń i znaczenia w teorii punktów stałych. Następnie przedstawione zostanie jego zastosowanie do dowodu twierdzenia Nasha. W tym celu skonstruowane zostanie odwzorowanie najlepszych odpowiedzi, a następnie wykazane zostanie, że spełnia ono warunki pozwalające na zastosowanie twierdzenia Kakutaniego.
 
        Referat ma na celu ukazanie związku między własnościami topologicznymi odwzorowań wielowartościowych a problemem istnienia równowagi w teorii gier.
    - name: "OPTIMAL CONSUMPTION UNDER GENERALIZED SUBLINEAR CIR-TYPE DISCOUNTING"
      speaker: "Karol Cieślik"
      type: "Blok stosowany"
      abstract: |-
        We consider an infinite-horizon optimal consumption problem with deterministic income and stochastic discounting. The discount factor is \(e^{−r_t}\) , where r is a conservative
        diffusion on [0,∞) whose dynamics in the interior are governed by
 
        \(dr_t = (ar_t + b)dt+ δr^γ_{t}dWt,  \quad a,b,δ >0,\quad 0 <γ <0.5\)
 
        The Hamilton–Jacobi–Bellman equation is reduced to a system of second-order ordinary differential equations with boundary, matching, and smooth-fit conditions. We distinguish two parameter regimes. If \(e^{−{r_t}}\) is a supermartingale, the maximal-consumption strategy is
        optimal: the initial wealth is consumed immediately, and deterministic income is consumed as it arrives. In the complementary regime, the function
 
        \(q(r) = \frac{\delta^2}{2}r^{2\gamma}−ar−b\)
 
        has two positive zeros. We prove that the waiting region is a bounded interval and that consumption is optimal outside this interval. Depending on the parameters, its lower endpoint is either positive or equal to zero. The free boundaries are uniquely characterised by a common-tangent system expressed in terms of the scale function, while the value function is represented by solutions of the corresponding boundary-value problems and is explicit up to quadratures. In contrast to the square-root case \(γ = 1/2\), the sublinear diffusion coefficient can therefore lead to a two-sided consumption region.
- time: "14:30"
  events:
    - name: "Jak (i po co) rzucić zdjęcie na wielomian"
      speaker: "Dominik Jur"
      type: "Blok teoretyczny"
      abstract: |-
        Krótko:
        Zaprezentuje niezbyt znany kawałek matematyki, teorie momentów i momentów niezmienniczych, skupiający się na opisie obrazów za pomocą liczb tak żeby to miało sens. Czyli podobne obrazki powinny być koło siebie w przestrzeni reprezentacji, różne daleko, ewentualnie obrócony obraz powinien mieć takie same reprezentacje czasami :)
 
        Dokładniej:
        Przedstawię metodę reprezentacji numerycznej obrazu opartana momentach Zernikego, czyli rzucie obrazu na ortogonalny układ wielomianów określonych na kole jednostkowym. Taki opis ma trzy właściwości istotne przy analizie kształtu. Jesteśmy w stanie w ten sposób stworzyć reprezentacje niezmiennicze na rotacje obrazu, skalowanie i translacje.
 
        Z momentów można też odtworzyć obraz, co pozwala przedstawić średni kształt grupy dodając metodzie wyjaśnialność. Całość jest deterministyczna i nie wymaga uczenia parametrów.
 
        Słowa kluczowe: momenty Zernikego, wielomiany ortogonalne, reprezentacja numeryczna obrazów
    - name: "Geodezyjne na powierzchniach obrotowych: od równań Clairauta do modelowania komputerowego"
      speaker: "Sofiia Andrusenko"
      type: "Blok stosowany"
      abstract: |-
        W pracy zbadano geometryczne właściwości geodezyjnych (najkrótszych dróg) na powierzchniach obrotowych, takich jak walec, sfera, stożek i torus. Na podstawie równań Eulera-Lagrange’a przedstawiono analityczne wyprowadzenie pierwszej całki równań ruchu - zależności Clairauta, wiążącej promień równoleżnika z kątem nachylenia krzywej. Wykazano, że w przypadku bardziej złożonych powierzchni (na przykład torusa) rozwiązanie analityczne prowadzi do całek, których nie można wyrazić za pomocą funkcji elementarnych.
        W celu przezwyciężenia tego problemu zastosowano przejście do układu równań różniczkowych drugiego rzędu z wykorzystaniem współczynników geometrycznych (symboli Christoffela). Opracowany przez autorkę program w języku Python, wykorzystujący biblioteki NumPy, SciPy i Matplotlib, umożliwia numeryczne całkowanie równań ruchu metodą Rungego-Kutty oraz tworzenie przejrzystych modeli trójwymiarowych. Przeprowadzone eksperymenty komputerowe potwierdziły właściwości teoretyczne badanych powierzchni, ukazując między innymi pętle samoprzecięć na stożku oraz strefy odbicia trajektorii na torusie.
