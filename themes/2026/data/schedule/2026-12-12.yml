  events:
    - name: "Jak szybko rosną algebry? Od liczenia słów do niemożliwych funkcji wzrostu"
      speaker: "Jakub Chmiel"
      type: "Blok teoretyczny"
      abstract: |-
        Jak szybko może rosnąć algebra? Wybierając skończony zbiór generatorów, możemy liczyć, ile liniowo niezależnych elementów da się uzyskać z iloczynów długości co najwyżej \(n\). Tak powstaje funkcja wzrostu, która pozwala porównywać algebry pod względem ich rozmiaru.
 
        Podczas referatu przedstawię podstawowe przykłady i własności funkcji wzrostu oraz pytanie o to, które funkcje można w ten sposób otrzymać. Przyjrzymy się jak w przestrzeni rosnących funkcji submultiplikatywnych wygląda zbiór funkcji wzrostu wraz z luką Bergmana, charakterystyką Bella–Zelmanova oraz wynikiem Greenfelda pokazującym, że nawet wśród bardzo szybko rosnących funkcji monotonicznych i submultiplikatywnych istnieją takie, które nie są równoważne funkcji wzrostu żadnej skończenie generowanej algebry. Wskażę również związek tych zagadnień z liczeniem słów w językach formalnych i rolę automatów skończonych.
 
        Referat będzie miał charakter przeglądowy, z naciskiem na przykłady i znaczenie wyników, bez szczegółowych dowodów.
    - name: "Tworzenie leków do walki z nowotworami: Jak działa model ChiENN?"
      speaker: "Emilia Porczyńska"
      type: "Blok stosowany"
      abstract: |-
        Projektowanie nowoczesnych terapii onkologicznych opiera się na precyzyjnym dopasowaniu cząsteczki leku do białek nowotworowych. Choć algorytmy potrafią generować miliony potencjalnych struktur, o ich skuteczności lub toksyczności decyduje subtelna geometria 3D.
        W niniejszym referacie przedstawiam proces generowania i weryfikacji cząsteczek oraz wyjaśniam, dlaczego klasyczne Grafowe Sieci Neuronowe zawodzą w przestrzeni trójwymiarowej. Następnie omawiam model ChiENN (Chiral Graph Neural Network) jako matematyczne rozwiązanie tego problemu. Skupiam się na stojącej za nim algebrze zorientowanych otoczeń lokalnych oraz modyfikacji operatora agregacji wiadomości. Wykazuję, jak konstrukcja ta pozwala uzyskać reprezentację niezmienniczą względem grupy obrotów SO(3), przy jednoczesnej wrażliwości na przekształcenia z grupy O(3)∖SO(3) bez konieczności stosowania sztywnych współrzędnych kartezjańskich.
- time: "17:00"
  events:
    - name: "Jak spełnił się sen Leibniza - czyli o liczbach hiperrzeczywistych i mierze Loeba"
      speaker: "Patryk Danieluk"
      type: "Blok teoretyczny"
      abstract: |-
        W \(1684\) r. Gottfried Leibniz wprowadził oznaczenie pochodnej \(\frac{dy}{dx}\), które nie miało symbolizować klasycznej granicy, lecz faktyczny iloraz nieskończenie małych wielkości. Intuicyjnie mechanizm ten działał bezbłędnie, jednak przez wieki pozostawał logicznie nieścisły. Marzenie Leibniza o rygorystycznych infinitezymalnych wielkościach zostało spełnione dopiero w latach 60. XX wieku, gdy Abraham Robinson przedstawił światu analizę niestandardową. Podczas referatu zaprezentuję konstrukcję ciała liczb **hiperrzeczywistych \({}^*\mathbb{R}\)** z wykorzystaniem **ultrafiltrów**. Przedstawię formalną definicję wielkości **nieskończenie małych** oraz kilka ich własności. Na koniec, z wykorzystaniem **twierdzenia Carathéodory’ego**, skonstruuję **miarę Loeba** na siatkach hiperskończonych. Pozwala to wysnuć zaskakujący wniosek, że w \({}^*\mathbb{R}\) miara **Lebesgue’a** staje się miarą **liczącą**, a podział na matematykę dyskretną i ciągłą traci sens.
    - name: "Optymalne zatrzymanie w warunkach niepewności: Od klasycznej granicy swobodnej do entropijnego sterowania osobliwego w wycenie opcji realnych"
      speaker: "Rai Ciszewska"
      type: "Blok stosowany"
      abstract: |-
        Tradycyjna teoria opcji realnych opiera się na deterministycznych regułach optymalnego zatrzymania, które zakładają pełną i dokładną znajomość parametrów stochastycznego równania różniczkowego (SDE) opisującego otoczenie gospodarcze. W rzeczywistych zastosowaniach parametry takie jak dryf \(\mu\) czy zmienność \(\sigma\) są obarczone błędem estymacji, a binarne reguły decyzyjne prowadzą do niedystrybuowalnych przestrzeni polityk oraz skrajnej rzadkości sygnału nagrody. Dyskwalifikuje to bezpośrednie użycie standardowych algorytmów uczenia ze wzmocnieniem (RL).
        W niniejszym referacie przyjrzymy się ciągłej konstrukcji regularyzacji entropijnej Shannona w ramach sterowania osobliwego dla problemów opcji realnych. Wyprowadzimy zamknięte rozwiązania analityczne dla klasycznego progu \(b^*\) oraz regularyzowanej granicy swobodnej \(g_{\lambda}(x)\) dla potęgowej funkcji zysku. Następnie omówimy i porównamy dwie metody numeryczne: modelowy algorytm iteracji polityki wykorzystujący metody różnic skończonych (PDE) oraz wolny od modelu algorytm uczenia ze wzmocnieniem (SPI-\(\lambda\)-OS) oparty na symulacjach Monte Carlo. Przyjrzymy się analizie zbieżności, wpływowi gęstości siatki, inicjalizacji polityki i redukcji wariancji (Common Random Numbers) oraz dowiedziemy, że podejście model-free skutecznie odtwarza optymalną granicę decyzyjną bez wcześniejszej znajomości dynamiki środowiska.
